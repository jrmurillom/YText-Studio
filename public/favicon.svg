<svg viewBox="0 0 1024 1024" width="1024" height="1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="fav-red" x1="112" y1="232" x2="912" y2="792" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="fav-play" x1="674" y1="624" x2="866" y2="816" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF0033" />
      <stop offset="100%" stop-color="#CC0000" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#fav-bg)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="216" stroke="#334155" stroke-width="14" stroke-opacity="0.5"/>

  <!-- Back Red Card -->
  <rect x="112" y="232" width="800" height="560" rx="48" fill="url(#fav-red)" transform="rotate(-5 512 512)" opacity="0.95" />

  <!-- Front White Card with Bold T -->
